<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Simple CPP favicon - pool water waves with blue gradient -->
  <defs>
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#11b6f0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#024e97;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#00112d" stroke="#11b6f0" stroke-width="2"/>
  
  <!-- Pool water waves -->
  <path d="M 20 40 Q 30 35, 40 40 T 60 40 T 80 40" 
        stroke="url(#waterGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 20 50 Q 30 45, 40 50 T 60 50 T 80 50" 
        stroke="url(#waterGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M 20 60 Q 30 55, 40 60 T 60 60 T 80 60" 
        stroke="url(#waterGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>
</svg>